[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Alex"}
]
requires-python = ">=3.14"

dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.19.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "httpx (>=0.28.0,<0.29.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "dishka (>=1.10.1,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.2,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-asyncio (>=0.24.0,<0.25.0)",
    "ipython (>=9.17.1,<10.0.0)"
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 120
exclude = [
    "migrations",
    ".venv",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "TID"]
ignore = [
    "B008",
    "SIM115",
    "RUF002",
    "RUF003",
    "SIM108",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

[tool.mypy]
python_version = "3.14"
strict = true
show_error_codes = true
ignore_missing_imports = true
